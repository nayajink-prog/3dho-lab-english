<style>
/* 3Dho LAB English · 색은 로고(흰 바탕·검은 3Dho·파란 LAB) 기준 */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --sunk:#eef1f5; --ink:#111418; --muted:#555d68; --line:#dfe3e8;
  --accent:#1f66d1; --accent-ink:#ffffff; --accent-soft:#e8f0fc; --brand:#111418;
  --good:#1d7a49; --good-soft:#e1f3e8; --warn:#94600e; --warn-soft:#faefdc; --bad:#b4332d; --bad-soft:#fce6e4;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-en:"Segoe UI","SF Pro Text",-apple-system,system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0e11; --surface:#15181d; --sunk:#1c2026; --ink:#eef1f4; --muted:#a6aeb8; --line:#2b3038;
  --accent:#6ea6ff; --accent-ink:#0a1322; --accent-soft:#16253d; --brand:#eef1f4;
  --good:#6fd39b; --good-soft:#12301f; --warn:#f0bd62; --warn-soft:#33270f; --bad:#ff8a82; --bad-soft:#3a1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0e11; --surface:#15181d; --sunk:#1c2026; --ink:#eef1f4; --muted:#a6aeb8; --line:#2b3038;
  --accent:#6ea6ff; --accent-ink:#0a1322; --accent-soft:#16253d; --brand:#eef1f4;
  --good:#6fd39b; --good-soft:#12301f; --warn:#f0bd62; --warn-soft:#33270f; --bad:#ff8a82; --bad-soft:#3a1a18; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-size:inherit}
.brand .day{margin-left:auto;font-family:var(--f-num);font-weight:600;color:var(--accent);font-size:14px;white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-top:18px}main>*{min-width:0}
h2{font-size:18px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.panel,.panel *{overflow-wrap:break-word;word-break:keep-all}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:0}
button,.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;-webkit-tap-highlight-color:transparent}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent}
button.sm{min-height:36px;padding:5px 11px;font-size:13px;border-radius:999px}
button:disabled{opacity:.45;cursor:default}
button.rec{background:var(--bad);border-color:var(--bad);color:var(--surface)}
button.rec.on{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
select,input[type=date],input[type=text],textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:44px;max-width:100%}
input[type=text],textarea{width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.logo{display:inline-flex;align-items:center;gap:7px;color:var(--brand);flex-wrap:wrap}
.logo .wm{font-family:"Space Grotesk",var(--f-body);font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1}
.logo b{font-family:"Space Grotesk",var(--f-body);font-size:10px;font-weight:700;letter-spacing:.32em;padding:3px 3px 3px 7px;border:1.5px solid var(--accent);border-radius:4px;color:var(--accent);line-height:1}
.logo em{font-style:normal;font-family:"Space Grotesk",var(--f-body);font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.02em}
.menubtn{border:0;background:transparent;padding:6px;min-height:40px;color:var(--ink)}
.drawer{position:fixed;inset:0;z-index:30;display:flex}
.drawer[hidden]{display:none!important}
.drawer .pane{width:min(300px,84vw);height:100%;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:grid;align-content:start;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.drawer .scrim{flex:1;background:color-mix(in srgb,#000 45%,transparent)}
.drawer nav{display:grid;gap:2px}
.drawer nav a{padding:11px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.drawer nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{min-height:36px;border:0;background:transparent;font-size:13px;font-weight:600;color:var(--muted);border-radius:8px;padding:4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px color-mix(in srgb,#000 18%,transparent)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:2px;text-decoration:none;color:inherit;min-height:78px;min-width:0;align-content:center}
.tile b{font-size:15px}
.tile span{font-size:12px;color:var(--muted)}
.tile.wide{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stats b{display:block;font-family:var(--f-num);font-size:26px;line-height:1.15;color:var(--accent)}
.stats span{font-size:12px;color:var(--muted)}
.en{font-family:var(--f-en);font-size:21px;font-weight:600;line-height:1.45;letter-spacing:-.005em;word-break:normal;overflow-wrap:break-word}
.en.sm{font-size:16px;font-weight:500}
.ko{color:var(--muted);font-size:15px}
.stage{background:var(--sunk);border-radius:14px;padding:18px 16px;display:grid;gap:10px;text-align:center}
.stage .en{font-size:23px}
.stage.hide .en{filter:blur(7px);user-select:none}
.alt{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:8px 12px;display:grid;gap:4px;text-align:left}
.alt .lbl,.lbl{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.note{font-size:13px;color:var(--muted)}
.diff{font-family:var(--f-en);font-size:18px;line-height:1.8;word-break:normal}
.diff .ok{color:var(--good);font-weight:600}
.diff .miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.heard{font-family:var(--f-en);font-size:15px;color:var(--muted)}
.score{font-family:var(--f-num);font-size:40px;font-weight:600;line-height:1}
.score.good{color:var(--good)}.score.warn{color:var(--warn)}.score.bad{color:var(--bad)}
.ctrl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ctrl button{flex-direction:column;gap:0;line-height:1.25;min-height:60px;font-size:14px}
.ctrl button small{font-weight:400;font-size:11px;opacity:.85}
.navrow{display:flex;gap:8px}
.navrow button{flex:1}
.sent{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.sent:first-of-type{border-top:0}
.sent .acts{display:flex;gap:6px}
.sent .acts button{min-height:38px;min-width:38px;padding:4px 9px;border-radius:999px}
.sent .alt{grid-column:1/-1}
.pweek{border-top:1px solid var(--line);padding-top:4px}
.pweek>summary{display:flex;gap:8px;align-items:center;cursor:pointer;padding:9px 2px;list-style:none;font-weight:600}
.pweek>summary::-webkit-details-marker{display:none}
.pweek>summary::before{content:"▸";color:var(--muted)}
.pweek[open]>summary::before{content:"▾"}
.pday{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 6px;border-top:1px solid var(--line)}
.pday.today{background:var(--accent-soft);border-radius:10px;border-top-color:transparent}
.pdate{display:grid;line-height:1.25}.pdate b{font-size:15px}.pdate span{font-size:11px;color:var(--muted)}
.pday.done .ptitle{color:var(--muted);text-decoration:line-through}
.pacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pcheck{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted)}
.pcheck input{width:24px;height:24px;accent-color:var(--accent);margin:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.steps ol{margin:0;padding-left:22px;display:grid;gap:8px;line-height:1.7}
.callout{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
a.link{color:var(--accent);font-weight:600;text-decoration:none}
.lstage{min-height:190px;display:grid;align-content:center;gap:10px;text-align:center;background:var(--sunk);border-radius:14px;padding:20px 14px}
.lstage .phase{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.05em}
details>summary{cursor:pointer}
#selftest{white-space:pre-wrap;font-size:12px}
.mission{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;background:var(--surface)}
.mission .grow{display:grid;gap:1px;flex:1;min-width:0}
.mission .mk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--accent-ink)}
.mission.done{background:var(--good-soft);border-color:transparent}
.mission.done .mk{background:var(--good);border-color:var(--good)}
.mission.done b{color:var(--good)}
.wbtn{font:inherit;min-height:0;padding:0 3px;border:0;border-radius:4px;background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px;display:inline;cursor:pointer}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.badge{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px;display:grid;gap:2px;opacity:.6}
.badge.on{opacity:1;border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.badge .bi{font-size:22px;color:var(--accent);line-height:1}
.dchat{display:grid;gap:10px}
.dmsg{max-width:86%;padding:10px 12px;border-radius:14px;display:grid;gap:3px;position:relative;min-width:0}
.dmsg.them{justify-self:start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;padding-right:52px}
.dmsg.me{justify-self:end;background:var(--accent-soft);border-bottom-right-radius:4px}
.dmsg .replay{position:absolute;right:8px;top:8px}
.me-turn{border-color:var(--accent)}
@media (max-width:420px){.en{font-size:19px}.stage .en{font-size:21px}.stats b{font-size:22px}}
</style>

<script>

   형식: [정중한 표현, 한국어 뜻, 실제 미국식 표현(선택), 메모(선택)] */

  ["Nice to meet you. I'm Min from the strategy team.", "만나서 반갑습니다. 전략팀의 민입니다.", "Hi, I'm Min. I'm on the strategy team.", "on the team = 그 팀 소속"],

PATTERNS.forEach(p => { const u = { id: p.id, t: p.p, c: p.c, kind: 'pattern' }; p.s.forEach((x, i) => { const sid = p.id + '-' + (i + 1); SENT[sid] = { sid, unit: u, en: x[1], ko: x[0], alt: '', note: p.tip }; }); });

    const date = addDays(S.start, i);

    const a = Math.floor(li * ORDER.length / learnN), b = Math.floor((li + 1) * ORDER.length / learnN);

  v.append(p);

/* ===== 설정·백업 ===== */

    if (!vs.length) s.append(el('p', 'small muted', '영어 음성 목록을 불러오는 중이거나 기기에 영어 음성이 없습니다. 아이폰은 설정 → 손쉬운 사용 → 읽기 및 말하기 → 음성에서 영어 음성을 받을 수 있습니다.'));

    const r2 = el('label', 'row'); r2.innerHTML = '<span class="small" style="width:60px">속도</span>'; rate.classList.add('grow'); r2.append(rate, rv); s.append(r2);
    s.append(btn('▶ 들어 보기', '', () => speak("Let's touch base next week.")));
  }
  s.append(el('p', 'small muted', `음성 인식: ${SR ? '사용 가능 (첫 사용 때 마이크 권한을 허용하세요)' : '이 브라우저는 미지원 · 키보드 받아쓰기를 쓰세요'}`));
  v.append(s);
  const b = el('section', 'panel'); b.innerHTML = '<h3>백업·복원</h3><p class="small muted">백업 파일(.json)을 저장해 두었다가 새 기기에서 복원하면 진도·점수·플랜이 그대로 옮겨집니다.</p>';
  const r = el('div', 'row');
  r.append(btn('백업 파일 저장', 'primary', () => {
    const blob = new Blob([JSON.stringify(S)], { type: 'application/json' }), a = el('a');
    a.href = URL.createObjectURL(blob); a.download = `3dho-english-backup-${today()}.json`; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }));
  const cp = btn('백업 글자로 복사', '', async () => { try { await navigator.clipboard.writeText(JSON.stringify(S)); cp.textContent = '복사됨 · 메모 앱에 붙여 넣어 두세요'; } catch (e) { cp.textContent = '복사 실패'; } });
  r.append(cp);
  const file = el('input'); file.type = 'file'; file.accept = '.json,application/json'; file.hidden = true;
  file.onchange = async () => { const f = file.files[0]; if (f) restore(await f.text()); };
  r.append(btn('백업 파일로 복원', '', () => file.click()), file);
  b.append(r);
  const ta = el('details'); ta.innerHTML = '<summary class="small">글자로 복원하기 (복사해 둔 백업 붙여 넣기)</summary>';
  const area = el('textarea'); area.rows = 3; area.style.marginTop = '8px'; ta.append(area, btn('이 내용으로 복원', 'sm', () => restore(area.value)));

  v.append(b);
  const z = el('section', 'panel'); z.innerHTML = '<h3>초기화</h3><p class="small muted">이 앱(영어)의 기록만 지웁니다. 같은 주소의 다른 3Dho LAB 앱 기록은 건드리지 않습니다.</p>';
  z.append(btn('영어 학습 기록 모두 지우기', '', () => { if (confirm('영어 학습 기록을 모두 지울까요? 되돌릴 수 없습니다. 먼저 백업을 권합니다.')) { S = blank(); PLAN = makePlan(); persist(); render(); } }));

}
function restore(txt) {
  try { const o = JSON.parse(txt); if (!o || o.v !== 1 || typeof o.items !== 'object') throw 0; if (!confirm('지금 기록을 백업 내용으로 바꿀까요?')) return; S = Object.assign(blank(), o); S.set = Object.assign(blank().set, o.set || {}); PLAN = makePlan(); persist(); alert('복원했습니다.'); go('home'); }
  catch (e) { alert('3Dho LAB English 백업 형식이 아닙니다.'); }
}

/* ===== 테마 ===== */
const TH = 'eng-theme';
function getTheme() { try { return localStorage.getItem(TH) || 'system'; } catch (e) { return 'system'; } }
function applyTheme() { const t = getTheme(); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); document.querySelectorAll('[data-th]').forEach(b => b.setAttribute('aria-pressed', b.dataset.th === t ? 'true' : 'false')); }
function setTheme(t) { try { localStorage.setItem(TH, t); } catch (e) { } applyTheme(); }
document.addEventListener('click', e => { const b = e.target.closest('[data-th]'); if (b) setTheme(b.dataset.th); });
const themeSeg = () => `<div class="seg" role="group" aria-label="화면 테마"><button type="button" data-th="system">시스템</button><button type="button" data-th="light">라이트</button><button type="button" data-th="dark">다크</button></div>`;

/* ===== 홈 화면 추가·공유 ===== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; const h = location.hash || '#home'; if (h.startsWith('#home') || h.startsWith('#install')) render(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; try { localStorage.setItem('eng-installed', '1'); } catch (e) { } render(); });
function isStandalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function inFrame() { try { return window.self !== window.top; } catch (e) { return true; } }
function platform() { const ua = navigator.userAgent || ''; const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); return { ios, android: /Android/.test(ua), inapp: /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(ua), iosOther: ios && /CriOS|FxiOS|EdgiOS|Whale/i.test(ua) }; }
function installSteps() {
  const p = platform(), share = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px" aria-label="공유"><path d="M12 3v12M8 7l4-4 4 4"/><rect x="5" y="10" width="14" height="11" rx="2"/></svg>';
  if (p.inapp) return `<ol><li><b>지금은 카카오톡 같은 앱 안의 브라우저</b>라 홈 화면에 추가할 수 없고 마이크도 잘 안 됩니다.</li><li>화면의 <b>⋯ 메뉴 → 다른 브라우저로 열기</b>를 누르세요. 아이폰은 <b>Safari</b>, 안드로이드는 <b>Chrome</b>.</li></ol>`;
  if (p.iosOther) return `<ol><li>아이폰은 <b>Safari</b>에서 추가하는 것이 가장 확실합니다. <b>주소 복사</b> 후 Safari에 붙여 넣어 여세요.</li><li>Safari의 <b>공유 버튼 ${share}</b> → <b>홈 화면에 추가</b> → <b>추가</b>.</li></ol>`;
  if (p.ios) return `<ol><li>Safari 화면 아래(또는 위)의 <b>공유 버튼 ${share}</b>을 누릅니다.</li><li>메뉴를 내려 <b>홈 화면에 추가</b>를 누릅니다.</li><li>이름이 <b>3Dho English</b>인지 확인하고 <b>추가</b>를 누르면 끝입니다.</li></ol>`;
  if (p.android) return `<ol><li><b>Chrome</b> 오른쪽 위 <b>⋮</b> 메뉴를 누릅니다.</li><li><b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누릅니다.</li></ol>`;
  return `<ol><li>PC에서는 <b>Chrome·Edge</b> 주소창 오른쪽의 <b>설치 아이콘</b>을 누르면 프로그램처럼 쓸 수 있습니다.</li><li>휴대폰에서 쓰려면 아래 <b>QR코드</b>를 휴대폰 카메라로 찍으세요.</li></ol>`;
}
function installCard(full) {
  const c = el('section', 'panel'); c.style.borderColor = 'var(--accent)';
  c.innerHTML = `<div class="row"><h3 class="grow">홈 화면에 추가하기</h3>${full ? '' : '<span class="pill info">1분</span>'}</div><p class="small">추가하면 앱처럼 아이콘을 눌러 바로 열리고, 인터넷이 없어도 열립니다. 앱스토어 설치나 로그인은 필요 없습니다.</p><div class="steps">${installSteps()}</div>`;
  const r = el('div', 'row');
  if (deferredPrompt) r.append(btn('지금 설치하기', 'primary', async () => { const p = deferredPrompt; deferredPrompt = null; try { p.prompt(); await p.userChoice; } catch (e) { } render(); }));
  const cp = btn('주소 복사', '', async () => { try { await navigator.clipboard.writeText(APP_URL); cp.textContent = '복사됨'; } catch (e) { cp.textContent = APP_URL; } }); r.append(cp);
  if (!full) r.append(btn('나중에', 'ghost', () => { try { localStorage.setItem('eng-install-later', String(Date.now() + 3 * 864e5)); } catch (e) { } render(); }), btn('다시 보지 않기', 'ghost', () => { try { localStorage.setItem('eng-install-off', '1'); } catch (e) { } render(); }));
  c.append(r); return c;
}
function shouldShowInstall() { if (isStandalone() || inFrame()) return false; try { if (localStorage.getItem('eng-install-off') || localStorage.getItem('eng-installed')) return false; if (Date.now() < (+localStorage.getItem('eng-install-later') || 0)) return false; } catch (e) { } return true; }
function shareCard() {
  const url = APP_URL + '#install', c = el('section', 'panel');
  c.innerHTML = `<h3>다른 분께 공유하기</h3><p class="small">링크를 받은 분이 열면 바로 홈 화면 추가 안내가 뜹니다. 카카오톡·라인 안에서 열어도 자동으로 <b>Safari·Chrome으로 다시 열립니다</b>.</p><div class="num small" style="word-break:break-all;background:var(--sunk);border-radius:8px;padding:8px 10px">${url}</div>`;
  const r = el('div', 'row'), msg = '3Dho LAB English · 듣고 따라 말하는 영어 회화 앱입니다. 링크를 열고 "홈 화면에 추가"를 누르면 앱처럼 쓸 수 있어요.';
  if (navigator.share) r.append(btn('공유하기 (카톡·문자 등)', 'primary', async () => { try { await navigator.share({ title: '3Dho LAB English', text: msg, url }); } catch (e) { } }));
  const cp = btn('링크와 안내문 복사', navigator.share ? '' : 'primary', async () => { try { await navigator.clipboard.writeText(msg + '\n' + url); cp.textContent = '복사됨'; } catch (e) { cp.textContent = '위 주소를 길게 눌러 복사하세요'; } });
  r.append(cp); c.append(r);
  c.insertAdjacentHTML('beforeend', `<details ${platform().ios || platform().android ? '' : 'open'}><summary class="small"><b>QR코드</b> · 휴대폰 카메라로 찍으면 바로 열립니다</summary><img src="share-qr.png" alt="3Dho LAB English 설치 안내 QR코드" width="300" height="380" style="display:block;margin:10px auto 0;max-width:100%;height:auto;border-radius:12px"></details>`);
  return c;
}
function viewInstall(v) { head(v, '홈 화면 추가 · 공유', isStandalone() ? '지금 홈 화면 앱으로 실행 중입니다.' : '아래 순서대로 홈 화면에 추가하세요.'); v.append(installCard(true)); v.append(shareCard()); }

/* ===== 시작 ===== */
applyTheme();
render();

/* ===== 자가 점검 (?selftest): 모든 화면을 그려 오류·가로 넘침을 #selftest에 기록 ===== */
if (/selftest/.test(location.search)) {
  const errs = []; window.addEventListener('error', e => errs.push('window: ' + e.message));
  const keys = ['home', 'plan', 'units', 'unit-B01', 'unit-L05', 'unit-day1', 'unit-day5', 'shadow-B01', 'shadow-day3', 'answer-L01', 'answer-day5', 'listen-today', 'listen-B10', 'review', 'sounds', 'ai', 'settings', 'install', 'shadow-due', 'answer-wrong', 'lesson-today', 'lesson-B01', 'lesson-day5', 'patterns', 'pattern-P01', 'pattern-P24', 'dialogs', 'dialog-D01', 'dialog-D14', 'listen-D03', 'badges'];
  const out = [];
  (async () => {
    for (const k of keys) {
      try { location.hash = k; render(); } catch (e) { errs.push(k + ': ' + e.message); }
      await wait(60);
      const W = document.documentElement.clientWidth, sw = document.documentElement.scrollWidth;
      const wide = [...document.querySelectorAll('#view *')].filter(x => { const r = x.getBoundingClientRect(); return r.width && r.right > W + 1; }).slice(0, 3).map(x => x.tagName + '.' + x.className);
      out.push(`${k}: scroll=${sw} view=${W}${sw > W || wide.length ? ' OVERFLOW ' + wide.join(',') : ' ok'}`);
    }
    /* 채점 함수 점검 */
    const t1 = similarity("I'm gonna turn my camera off.", 'I am going to turn my camera off'), t2 = keyScore('Could you send me the latest numbers?', 'can you send me latest numbers');
    out.push(`similarity=${t1.score} keyScore=${t2.score} units=${UNITS.length} sentences=${ALLSID.length} plan90=${makePlan(90).length} plan30units=${new Set(makePlan(30).flatMap(d => d.type === 'learn' ? d.units : [])).size}`);
    const dup = UNIT_SIDS.length - new Set(UNIT_SIDS.map(s => SENT[s].en)).size; out.push('duplicate-en=' + dup + ' patterns=' + PATTERNS.length + ' dialogs=' + DIALOGS.length + ' all=' + ALLSID.length + ' blank=' + blankOf("Could you send me the latest numbers?") + ' missingPat=' + PLAN.filter(d => !PSET[d.pat] || !DSET[d.dlg]).length);
    /* 레슨·패턴·대화 화면에서 채점 흐름이 도는지 (입력칸으로 제출) */
    for (const k of ['lesson-B02', 'pattern-P02']) { location.hash = k; render(); await wait(40); const sb = document.querySelector('#view button.primary:not([disabled])'); if (k.startsWith('pattern')) { [...document.querySelectorAll('#view button')].find(b => b.textContent === '드릴 시작').click(); await wait(20); } const f = document.querySelector('#view form'); if (f) { f.querySelector('input').value = k.startsWith('lesson') ? "Our company develops software for manufacturers." : "I'd like to introduce myself."; f.requestSubmit(); await wait(20); out.push(k + ' scored=' + ((document.querySelector('#view .score') || {}).textContent || 'none')); } else out.push(k + ' NO FORM'); }
    { location.hash = 'dialog-D12'; render(); await wait(20); [...document.querySelectorAll('#view button')].find(b => b.textContent.includes('대화 시작')).click(); await wait(9000);
      const f = document.querySelector('.me-turn form'); if (f) { f.querySelector('input').value = 'Can I get a medium iced latte please'; f.requestSubmit(); await wait(30); out.push('dialog-D12 turn1 scored=' + ((document.querySelector('.me-turn .score') || {}).textContent || 'none') + ' bubbles=' + document.querySelectorAll('.dmsg').length); } else out.push('dialog-D12 NO TURN bubbles=' + document.querySelectorAll('.dmsg').length); }
    location.hash = 'home'; render();
    const pre = el('pre'); pre.id = 'selftest'; pre.textContent = 'ERRORS=' + errs.length + '\n' + errs.join('\n') + '\n' + out.join('\n'); document.body.append(pre);
  })();
}
